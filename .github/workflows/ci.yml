name: CI

# Runs on every push and PR. Both jobs are self-contained — the
# frontend job needs no backend, and the backend job's unit tests
# (tests/test_unit.py) mock Ollama and Chroma, so nothing here needs a
# live model server or a populated vector database. The heavier
# end-to-end suite (tests/test_api.py) requires a
# real Ollama and are run locally, not in CI.

on:
  push:
    branches: [main, react-migration]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_unit -v
